<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR & Barcode Scanner to Google Sheet</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial; text-align: center; background: #f7f7f7; margin: 0; padding: 0; }
    #reader { width: 90%; max-width: 400px; margin: 20px auto; }
    #result { margin-top: 10px; background: #fff; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>📷 QR & Barcode Scanner</h2>
  <div id="reader"></div>
  <div id="result">Hasil scan akan muncul di sini...</div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxHRpKhfPjwODcdLPEH5GujMjOhWGBnZ5zwTSP6o-rCWuyPStY7jzX2dzJ0gObfiXAf/exec";

    function updateResult(text) {
      document.getElementById("result").innerText = "✅ Hasil: " + text;
    }

    async function sendToSheet(value) {
      try {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ value })
        });
        const json = await res.json();
        console.log("Tersimpan:", json);
      } catch (err) {
        console.error("Gagal kirim ke Sheet:", err);
      }
    }

    function startScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        decodedText => {
          updateResult(decodedText);
          sendToSheet(decodedText);
          html5QrCode.stop(); // hentikan setelah scan pertama
        }
      ).catch(err => {
        document.getElementById("result").innerText = "❌ Tidak bisa akses kamera: " + err;
      });
    }

    startScanner();
  </script>
</body>
</html>
